<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Inicio de sesión - Versand</title>
  <script>
    async function login(event) {
      event.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const response = await fetch('https://fgdiaz-JR.github.io/Versand-inicio-sesion/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await response.json();
      const output = document.getElementById('output');
      if (response.ok) {
        output.textContent = 'Login OK. Token: ' + data.access_token;
      } else {
        output.textContent = 'Error: ' + (data.message || 'unknown');
      }
    }
  </script>
</head>
<body>
  <h1>Iniciar sesión</h1>
  <form onsubmit="login(event)">
    <label>Email: <input type="email" id="email" required></label><br>
    <label>Contraseña: <input type="password" id="password" required></label><br>
    <button type="submit">Entrar</button>
  </form>
  <pre id="output"></pre>
</body>
</html>
